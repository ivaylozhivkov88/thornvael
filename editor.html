<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thornvael map editor</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: #14100c; color: #d8c9a8; font: 14px Georgia, serif; display: grid; grid-template-columns: 220px 1fr 420px; grid-template-rows: auto 1fr; height: 100dvh; }
header { grid-column: 1 / 4; display: flex; gap: 8px; align-items: center; padding: 6px 10px; background: #231a10; border-bottom: 1px solid #8a6b3a; flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0 12px 0 0; }
button, select, input, textarea { background: #3a2c1c; color: #f0e2bd; border: 1px solid #8a6b3a; border-radius: 4px; font: inherit; padding: 4px 8px; }
button { cursor: pointer; }
button.on { background: #7a5a24; }
aside { overflow-y: auto; padding: 8px; border-right: 1px solid #8a6b3a; }
aside h3, #side h3 { margin: 10px 0 4px; font-size: 13px; color: #d8b24a; }
aside .row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
aside label { display: block; margin: 4px 0; }
main { overflow: auto; background: #0c0a07; }
canvas { display: block; image-rendering: pixelated; cursor: crosshair; }
#side { overflow-y: auto; padding: 8px; border-left: 1px solid #8a6b3a; }
.tabs { display: flex; gap: 4px; margin-bottom: 8px; }
.trig { border: 1px solid #5a4428; border-radius: 6px; padding: 6px; margin-bottom: 8px; }
.trig .line { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin: 3px 0; }
.trig input[type=number] { width: 56px; }
.trig input[type=text] { width: 120px; }
small { opacity: .75; }
#errors { color: #f08a7a; white-space: pre-line; }
#info { margin-left: auto; opacity: .8; }
textarea { width: 100%; height: 360px; font: 12px monospace; }
@media (max-width: 900px) { body { display: block; } main { height: 50dvh; } }
</style>
</head>
<body>
<header><h1>Thornvael map editor</h1>
<button id="b-new">New</button><button id="b-open">Open…</button><button id="b-save">Save file</button><button id="b-check">Check</button><button id="b-test">Test play</button>
<input id="f-open" type="file" accept=".json,application/json" hidden>
<span id="info"></span></header>
<aside id="tools"></aside>
<main><canvas id="cv"></canvas></main>
<div id="side"></div>
<script type="module" src="/src/editor/editor.ts"></script>
</body>
</html>
