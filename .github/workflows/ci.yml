name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:repo
      - run: npm run typecheck
      - run: npm run validate
      - run: npm run check:atlases
      - name: Biome lint & QA formatting check
        run: |
          npx --yes @biomejs/biome@2.6.8 lint --reporter=summary
          npx --yes @biomejs/biome@2.6.8 check \
            biome.json \
            playwright.smoke.config.ts \
            tests/biome-seeds-all.test.ts \
            tests/pwa-smoke.spec.ts \
            tools/rebuild-and-check.mjs \
            tools/perf-profile-300.mjs \
            tools/seed-gallery.mjs
      - run: npm test -- --maxWorkers=1
      - run: npm run build
        env:
          SITE_BASE: /thornvael/

  playwright-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.project == 'webkit' && 8 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_BASE: /thornvael/
      - run: npx playwright install --with-deps ${{ matrix.project }}
      - name: Run PWA & biome smoke tests (${{ matrix.project }})
        run: npx playwright test -c playwright.smoke.config.ts --project=${{ matrix.project }} --reporter=list
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-smoke-results-${{ matrix.project }}
          path: test-results
          retention-days: 5
